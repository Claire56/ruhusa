name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync project
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest

      - name: Build package
        run: uv build

      - name: Smoke test base wheel
        run: |
          WHEEL="$(realpath "$(find dist -name 'ruhusa-*.whl' -print -quit)")"

          uv venv --python 3.12 /tmp/ruhusa-base

          uv pip install \
            --python /tmp/ruhusa-base/bin/python \
            "$WHEEL"

          /tmp/ruhusa-base/bin/python - <<'PY'
          import importlib.util
          from importlib.metadata import version

          import ruhusa

          assert ruhusa.Ruhusa is not None
          assert version("ruhusa") == "0.7.0rc1"
          assert importlib.util.find_spec("psycopg") is None
          PY

  postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ruhusa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ruhusa_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RUHUSA_TEST_POSTGRES_DSN: >-
        postgresql://postgres:postgres@localhost:5432/ruhusa_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync project with PostgreSQL support
        run: uv sync --locked --extra postgres

      - name: Run PostgreSQL integration tests
        run: >-
          uv run pytest
          tests/test_postgres_stores.py
          tests/test_postgres_execution_store.py
          tests/test_postgres_audit.py
          tests/test_postgres_schema_compatibility.py

      - name: Build package
        run: uv build

      - name: Smoke test PostgreSQL wheel extra
        run: |
          WHEEL="$(realpath "$(find dist -name 'ruhusa-*.whl' -print -quit)")"

          uv venv --python 3.12 /tmp/ruhusa-postgres

          uv pip install \
            --python /tmp/ruhusa-postgres/bin/python \
            "ruhusa[postgres] @ file://${WHEEL}"

          /tmp/ruhusa-postgres/bin/python - <<'PY'
          import psycopg

          from ruhusa.postgres import (
              PostgresAuditLog,
              PostgresExecutionStore,
              PostgresGrantStore,
              PostgresInvocationStore,
              PostgresRevocationStore,
              PostgresToolRegistry,
          )

          assert psycopg is not None
          assert PostgresGrantStore is not None
          assert PostgresRevocationStore is not None
          assert PostgresInvocationStore is not None
          assert PostgresToolRegistry is not None
          assert PostgresExecutionStore is not None
          assert PostgresAuditLog is not None
          PY