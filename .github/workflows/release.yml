name: Publish release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Exact release tag to publish"
        required: true
        default: "v0.8.0"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest

    outputs:
      release_ref: ${{ steps.release_ref.outputs.release_ref }}
      package_version: ${{ steps.version.outputs.package_version }}

    steps:
      - name: Resolve release ref
        id: release_ref
        shell: bash
        env:
          MANUAL_REF: ${{ inputs.release_ref }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_ref="${MANUAL_REF}"
          else
            release_ref="${RELEASE_TAG}"
          fi

          if [[ -z "${release_ref}" ]]; then
            echo "Release ref is empty."
            exit 1
          fi

          if [[ "${release_ref}" != v* ]]; then
            echo "Release ref must be a version tag beginning with 'v'."
            exit 1
          fi

          echo "release_ref=${release_ref}" >> "${GITHUB_OUTPUT}"

      - name: Check out exact release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release_ref.outputs.release_ref }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Verify package version matches tag
        id: version
        shell: bash
        env:
          RELEASE_REF: ${{ steps.release_ref.outputs.release_ref }}
        run: |
          package_version="$(
            python3 - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)

          print(data["project"]["version"])
          PY
          )"

          tag_version="${RELEASE_REF#v}"

          echo "Package version: ${package_version}"
          echo "Tag version:     ${tag_version}"

          if [[ "${package_version}" != "${tag_version}" ]]; then
            echo "Package version does not match release tag."
            exit 1
          fi

          echo "package_version=${package_version}" >> "${GITHUB_OUTPUT}"

      - name: Build package
        run: uv build

      - name: Verify expected artifacts
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          test -f "dist/ruhusa-${PACKAGE_VERSION}.tar.gz"
          test -f "dist/ruhusa-${PACKAGE_VERSION}-py3-none-any.whl"

      - name: Check package metadata
        run: uvx twine check dist/*

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs:
      - build

    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/ruhusa/${{ needs.build.outputs.package_version }}/

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
