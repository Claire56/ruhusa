name: Publish Python package

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Git tag to publish"
        required: true
        default: "v0.7.0"
        type: string

  release:
    types: [published]

jobs:
  build:
    name: Build release distributions
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify package version
        run: |
          EXPECTED="${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_ref }}"
          EXPECTED="${EXPECTED#v}"
          ACTUAL=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "Release version: $EXPECTED"
          echo "Package version: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Build distributions
        run: uv build

      - name: Verify release artifacts
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
          ls -lah dist

      - name: Upload release distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi

    permissions:
      id-token: write

    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish release distributions
        uses: pypa/gh-action-pypi-publish@release/v1
